name: Build TVApp Mobile Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mobile-test.yml"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".build"

permissions:
  contents: write

concurrency:
  group: tvapp-mobile-test
  cancel-in-progress: true

jobs:
  mobile-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TVAPP_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "TVAPP_KEYSTORE_BASE64 secret is missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tvapp-release.jks"

      - name: Test and build mobile APK
        env:
          TVAPP_KEYSTORE_PATH: ${{ runner.temp }}/tvapp-release.jks
          TVAPP_KEY_ALIAS: ${{ secrets.TVAPP_KEY_ALIAS }}
          TVAPP_KEY_PASSWORD: ${{ secrets.TVAPP_KEY_PASSWORD }}
          TVAPP_STORE_PASSWORD: ${{ secrets.TVAPP_STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testMobileDebugUnitTest assembleMobileDebug

      - name: Publish mobile test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="mobile-r${{ github.run_number }}"
          SHA256=$(sha256sum app/build/TVApp-Mobile-Test.apk | cut -d' ' -f1)
          NOTES="Mobile test revision ${{ github.run_number }} · Separate package com.tvapp.livetv.mobile · SHA-256: $SHA256 · This prerelease is not used by TVApp's update manifest."
          gh release create "$TAG" app/build/TVApp-Mobile-Test.apk \
            --target "$(git rev-parse HEAD)" \
            --title "TVApp Mobile Test r${{ github.run_number }}" \
            --notes "$NOTES" \
            --prerelease
