name: Build IJK fallback experiment

on:
  workflow_dispatch:
  push:
    branches: [codex/ijk-fallback]
    paths-ignore:
      - ".build"
      - "**/*.md"

permissions:
  contents: write

concurrency:
  group: tvapp-ijk-experiment
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TVAPP_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "TVAPP_KEYSTORE_BASE64 secret is missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tvapp-release.jks"

      - name: Test and build ARM experiment
        env:
          TVAPP_KEYSTORE_PATH: ${{ runner.temp }}/tvapp-release.jks
          TVAPP_KEY_ALIAS: ${{ secrets.TVAPP_KEY_ALIAS }}
          TVAPP_KEY_PASSWORD: ${{ secrets.TVAPP_KEY_PASSWORD }}
          TVAPP_STORE_PASSWORD: ${{ secrets.TVAPP_STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testLocalDebugUnitTest testPaidDebugUnitTest assembleLocalRelease \
            -PtvappTargetAbis=arm64-v8a,armeabi-v7a \
            -PtvappExperimentalMinify=true

      - name: Enforce APK size budget
        id: asset
        shell: bash
        run: |
          cp app/build/outputs/apk/local/release/app-local-release.apk TVApp-IJK-Experiment.apk
          BYTES=$(stat -c%s TVApp-IJK-Experiment.apk)
          LIMIT=$((30 * 1024 * 1024))
          test "$BYTES" -le "$LIMIT" || { echo "APK exceeds 30 MiB: $BYTES bytes"; exit 1; }
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum TVApp-IJK-Experiment.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="ijk-r${{ github.run_number }}"
          NOTES="Media3 primary + IJK decoder/source fallback experiment. Size: ${{ steps.asset.outputs.bytes }} bytes. SHA-256: ${{ steps.asset.outputs.sha256 }}"
          gh release create "$TAG" TVApp-IJK-Experiment.apk \
            --target "$(git rev-parse HEAD)" \
            --title "TVApp IJK Fallback Experiment" \
            --notes "$NOTES" \
            --prerelease
