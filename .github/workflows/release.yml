name: Build and release TVApp

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - ".build"
      - "**/*.md"

permissions:
  contents: write

concurrency:
  group: tvapp-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read development version
        id: version
        shell: bash
        run: |
          BUILD=$(tr -d '[:space:]' < .build)
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "version=0.1.$BUILD" >> "$GITHUB_OUTPUT"
          echo "revision=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TVAPP_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "TVAPP_KEYSTORE_BASE64 secret is missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tvapp-release.jks"

      - name: Test and build signed APK
        env:
          TVAPP_KEYSTORE_PATH: ${{ runner.temp }}/tvapp-release.jks
          TVAPP_KEY_ALIAS: ${{ secrets.TVAPP_KEY_ALIAS }}
          TVAPP_KEY_PASSWORD: ${{ secrets.TVAPP_KEY_PASSWORD }}
          TVAPP_STORE_PASSWORD: ${{ secrets.TVAPP_STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testLocalDebugUnitTest testPaidDebugUnitTest assembleLocalRelease assemblePaidDebug bundlePaidRelease assembleMobileDebug \
            -PtvappTargetAbis=arm64-v8a,armeabi-v7a

      - name: Prepare release assets
        id: assets
        shell: bash
        run: |
          cp app/build/outputs/apk/local/release/app-local-release.apk TVApp.apk
          cp app/build/outputs/apk/paid/debug/app-paid-debug.apk TVApp-Paid-Test.apk
          cp app/build/outputs/apk/mobile/debug/app-mobile-debug.apk TVApp-Mobile.apk
          SHA256=$(sha256sum TVApp.apk | cut -d' ' -f1)
          MOBILE_SHA256=$(sha256sum TVApp-Mobile.apk | cut -d' ' -f1)
          PUBLISHED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          cat > version.json <<EOF
          {
            "package": "com.tvapp.livetv",
            "versionCode": ${{ steps.version.outputs.build }},
            "versionName": "${{ steps.version.outputs.version }}",
            "build": ${{ steps.version.outputs.build }},
            "revision": ${{ steps.version.outputs.revision }},
            "apkUrl": "https://github.com/${{ github.repository }}/releases/latest/download/TVApp.apk",
            "sha256": "$SHA256",
            "publishedAt": "$PUBLISHED_AT",
            "mandatory": false,
            "packages": {
              "com.tvapp.livetv": {
                "versionCode": ${{ steps.version.outputs.build }},
                "versionName": "${{ steps.version.outputs.version }}",
                "apkUrl": "https://github.com/${{ github.repository }}/releases/latest/download/TVApp.apk",
                "sha256": "$SHA256"
              },
              "com.tvapp.mobile": {
                "versionCode": ${{ steps.version.outputs.build }},
                "versionName": "${{ steps.version.outputs.version }}-mobile",
                "apkUrl": "https://github.com/${{ github.repository }}/releases/latest/download/TVApp-Mobile.apk",
                "sha256": "$MOBILE_SHA256"
              }
            }
          }
          EOF
          cat > version-mobile.json <<EOF
          {
            "package": "com.tvapp.mobile",
            "versionCode": ${{ steps.version.outputs.build }},
            "versionName": "${{ steps.version.outputs.version }}-mobile",
            "build": ${{ steps.version.outputs.build }},
            "revision": ${{ steps.version.outputs.revision }},
            "apkUrl": "https://github.com/${{ github.repository }}/releases/latest/download/TVApp-Mobile.apk",
            "sha256": "$MOBILE_SHA256",
            "publishedAt": "$PUBLISHED_AT",
            "mandatory": false
          }
          EOF
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Publish development release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="dev-r${{ steps.version.outputs.revision }}"
          TITLE="TVApp Development"
          NOTES="Revision ${{ steps.version.outputs.revision }} · versionCode ${{ steps.version.outputs.build }} · SHA-256: ${{ steps.assets.outputs.sha256 }} · TVApp.apk (com.tvapp.livetv), TVApp-Paid-Test.apk (Play Test), TVApp-Mobile.apk (com.tvapp.mobile)."
          gh release create "$TAG" TVApp.apk TVApp-Paid-Test.apk TVApp-Mobile.apk version.json version-mobile.json \
            --target "$(git rev-parse HEAD)" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --latest
