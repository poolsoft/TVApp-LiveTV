<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TVApp IPTV</title><style>
*{box-sizing:border-box}body{margin:0;background:#111518;color:#edf1f4;font:15px system-ui,sans-serif}header{border-bottom:1px solid #38434b;padding:20px 24px}h1{font-size:22px;margin:0}main{max-width:1100px;margin:auto;padding:24px}h2{font-size:17px}section{margin-bottom:28px}form{display:grid;gap:14px;max-width:560px}label{display:grid;gap:6px;color:#bfcbd2}input,select,button{font:inherit;border:1px solid #576570;border-radius:5px;padding:10px;background:#222b31;color:#fff;min-height:42px}button{cursor:pointer}button[type=submit]{background:#18705c;border-color:#339f86}button:disabled{opacity:.45;cursor:wait}:focus-visible{outline:3px solid #59baff;outline-offset:2px}[hidden]{display:none!important}#status{position:sticky;top:0;padding:12px 0;background:#111518;white-space:pre-wrap;color:#75d8bf}#status.busy:before{content:'';display:inline-block;width:12px;height:12px;margin-right:8px;border:2px solid #75d8bf;border-right-color:transparent;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.source{padding:16px 0;border-bottom:1px solid #38434b;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px}.name{font-weight:650}.meta,.address{margin-top:6px;color:#bfcbd2;font-size:13px;overflow-wrap:anywhere}.actions{display:flex;gap:8px;align-items:center}.delete{color:#ffb4b4}p{color:#bfcbd2;line-height:1.5}#pairing{max-width:560px}@media(max-width:600px){main{padding:16px}.source{grid-template-columns:1fr}.actions{justify-content:flex-end}}
#management{display:grid;grid-template-columns:340px minmax(0,1fr);gap:32px}#management form{max-width:none}@media(max-width:850px){#management{grid-template-columns:1fr;gap:0}}
</style></head><body><header><h1 data-label="title"></h1></header><main>
<section id="pairing"><p data-label="security"></p><form id="pairForm"><label><span data-label="code"></span><input id="code" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" autocomplete="off" required></label><button type="submit" data-label="pair"></button></form></section>
<div id="status" role="status" aria-live="polite"></div>
<div id="management" hidden><section><h2 data-label="add"></h2><form id="addForm">
<label><select id="kind" aria-label="IPTV"><option value="URL"></option><option value="DOCUMENT"></option><option value="XTREAM"></option><option value="STALKER"></option></select></label>
<label><span data-label="name"></span><input id="name" maxlength="200" required></label>
<label id="urlRow"><span data-label="url"></span><input id="url" type="url" required autocomplete="off"></label>
<label id="fileRow" hidden><span data-label="file"></span><input id="file" type="file" accept=".m3u,.m3u8,.txt"></label>
<label id="usernameRow" hidden><span data-label="username"></span><input id="username" autocomplete="off"></label>
<label id="passwordRow" hidden><span data-label="password"></span><input id="password" type="password" autocomplete="off"></label>
<label id="macRow" hidden><span data-label="mac"></span><input id="mac" autocomplete="off"></label>
<button type="submit" data-label="add"></button></form></section>
<section><h2 data-label="saved"></h2><div id="sources"></div></section></div>
<script>
'use strict';const L=__LABELS__;const $=id=>document.getElementById(id);let token='',busy=false,signature='',polling=false;
document.documentElement.lang=navigator.language;document.querySelectorAll('[data-label]').forEach(e=>e.textContent=L[e.dataset.label]);
[...$('kind').options].forEach(o=>o.textContent=L[o.value]);
async function request(path,data){const r=await fetch(path,{method:data?'POST':'GET',headers:{'Content-Type':'application/json','X-TVApp-Token':token},body:data?JSON.stringify(data):undefined,cache:'no-store'});if(!r.ok)throw Error(r.status===401?L.code:r.status===429?L.failed:L.failed);return r.json()}
function status(text,working=false){$('status').textContent=text;$('status').classList.toggle('busy',working)}
$('pairForm').onsubmit=async e=>{e.preventDefault();try{const result=await request('/pair',{code:$('code').value});token=result.token;$('code').value='';$('pairing').hidden=true;$('management').hidden=false;await poll()}catch(e){status(e.message)}};
$('kind').onchange=()=>{const kind=$('kind').value;for(const [id,visible] of [['url',kind!=='DOCUMENT'],['file',kind==='DOCUMENT'],['username',kind==='XTREAM'],['password',kind==='XTREAM'],['mac',kind==='STALKER']]){$(id+'Row').hidden=!visible;$(id).required=visible}};
$('addForm').onsubmit=async e=>{e.preventDefault();if(busy)return;try{const data={action:'add',kind:$('kind').value,name:$('name').value,url:$('url').value,username:$('username').value,password:$('password').value,mac:$('mac').value};if(data.kind==='DOCUMENT'){const f=$('file').files[0];if(!f||f.size>12*1024*1024)throw Error(L.uploadLimit);data.content=await f.text()}await command(data);$('password').value=''}catch(e){status(e.message)}};
async function command(data){busy=true;lock();try{await request('/command',data);await poll()}catch(e){busy=false;lock();throw e}}
function lock(){document.querySelectorAll('#management button,#management input,#management select').forEach(e=>e.disabled=busy)}
function render(sources){const newSignature=JSON.stringify(sources);if(signature===newSignature)return;signature=newSignature;$('sources').replaceChildren();if(!sources.length){$('sources').textContent=L.empty;return}sources.forEach(s=>{const row=document.createElement('div');row.className='source';const info=document.createElement('div');const name=document.createElement('div');name.className='name';name.textContent=s.name;info.append(name);const meta=document.createElement('div');meta.className='meta';meta.textContent=(L[s.kind]||s.kind)+' · '+L.counts.replace('%1$d',s.channels).replace('%2$d',s.selected)+(s.updated?' · '+new Date(s.updated).toLocaleString():'');info.append(meta);if(s.url){const url=document.createElement('div');url.className='address';url.textContent=s.url;info.append(url)}row.append(info);const actions=document.createElement('div');actions.className='actions';if(s.kind==='URL'){const b=document.createElement('button');b.textContent='↻ '+L.update;b.onclick=()=>command({action:'update',id:s.id}).catch(e=>status(e.message));actions.append(b)}const del=document.createElement('button');del.className='delete';del.textContent='× '+L.delete;del.onclick=()=>{if(confirm(L.confirm+'\n'+s.name))command({action:'delete',id:s.id}).catch(e=>status(e.message))};actions.append(del);row.append(actions);$('sources').append(row)});lock()}
async function poll(){if(!token||polling)return;polling=true;try{const state=await request('/state');busy=state.busy;render(state.sources);lock();status(state.message,busy)}catch(e){status(L.offline);$('management').hidden=true;$('pairing').hidden=false;token=''}finally{polling=false}}
setInterval(poll,1500);
</script></main></body></html>
